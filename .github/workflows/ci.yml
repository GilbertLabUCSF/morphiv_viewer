name: portal checks

on:
  pull_request:
  push:
    branches: [main, deployment]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install "pandas>=2.0" "plotly>=5.18" "streamlit>=1.52"
      - name: Compile Python sources
        run: python -m compileall -q app.py pages src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: bash -n run.sh scripts/upload_to_gcp.sh scripts/sync_to_gcp.sh
