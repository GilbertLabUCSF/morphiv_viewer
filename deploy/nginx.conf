# MORPHIC Portal & cellxgene Gateway Nginx Configuration
# Deploy to: /etc/nginx/sites-available/perturb.dev
# Then: sudo ln -sf /etc/nginx/sites-available/perturb.dev /etc/nginx/sites-enabled/

# Main site: perturb.dev -> Morphic Streamlit Portal
server {
    listen 80;
    server_name perturb.dev www.perturb.dev;

    # Reverse proxy to Streamlit
    location / {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # WebSocket support for Streamlit real-time features
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# Subdomain: cellxgene.perturb.dev -> cellxgene gateway
server {
    listen 80;
    server_name cellxgene.perturb.dev;

    location / {
        # Update port if cellxgene gateway runs on different port
        proxy_pass http://127.0.0.1:5005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
