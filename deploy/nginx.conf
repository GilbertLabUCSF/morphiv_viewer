# MORPHIC Portal & cellxgene Gateway Nginx Configuration
# Deploy to: /etc/nginx/sites-available/perturb.dev
# Then: sudo ln -sf /etc/nginx/sites-available/perturb.dev /etc/nginx/sites-enabled/

# Main site: perturb.dev
server {
    server_name perturb.dev www.perturb.dev;

    # Public landing page (no auth)
    root /opt/morphic/website/deploy/landing;

    location = / {
        try_files /index.html =404;
    }

    # Streamlit app behind basic auth at /app/
    location /app/ {
        auth_basic           "MORPHIC Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # WebSocket support for Streamlit
    location /app/_stcore/stream {
        auth_basic           "MORPHIC Portal";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/perturb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perturb.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Subdomain: cellxgene.perturb.dev -> cellxgene gateway (with basic auth)
server {
    listen 80;
    listen 443 ssl;
    server_name cellxgene.perturb.dev;

    ssl_certificate /etc/letsencrypt/live/perturb.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perturb.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic           "cellxgene gateway";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_buffering off;
    }
}

# Fallback for IP-based access (34.46.167.158)
server {
    listen 80 default_server;
    server_name _;

    auth_basic           "cellxgene gateway";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    location /morphic/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /morphic/_stcore/stream {
        auth_basic off;
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# HTTP to HTTPS redirect for perturb.dev
server {
    listen 80;
    server_name perturb.dev www.perturb.dev;
    return 301 https://$host$request_uri;
}
